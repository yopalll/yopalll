<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Yosua Valentino Gulo - @yopalll">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#770707"/>
      <stop offset="55%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#1A5187"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="2" height="14" fill="#ffffff" opacity="0.045"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DF3232"/>
      <stop offset="100%" stop-color="#1A5187"/>
    </linearGradient>
    <style>
      .name { font: 800 46px 'Segoe UI', Arial, sans-serif; fill: #ffffff; letter-spacing: 1px; }
      .handle { font: 600 22px 'Consolas', 'Courier New', monospace; fill: #989898; }
      .role { font: 600 15px 'Consolas', 'Courier New', monospace; fill: #ffffff; opacity: .85; letter-spacing: 1.5px; }
      .glyph { font: 800 170px 'Consolas', 'Courier New', monospace; fill: #ffffff; opacity: .06; }
      @keyframes slide { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .bar { transform-origin: 60px 0; animation: slide 1.1s ease-out forwards; }
      .f1 { animation: fade .8s ease-out .1s both; }
      .f2 { animation: fade .8s ease-out .35s both; }
      .f3 { animation: fade .8s ease-out .6s both; }
    </style>
  </defs>

  <rect width="1000" height="240" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="240" rx="14" fill="url(#stripes)"/>

  <text x="640" y="190" class="glyph">&lt;/&gt;</text>

  <rect class="bar" x="60" y="48" width="120" height="6" rx="3" fill="url(#accent)"/>
  <text x="60" y="108" class="name f1">YOSUA VALENTINO GULO</text>
  <text x="60" y="146" class="handle f2">@yopalll</text>
  <text x="60" y="180" class="role f3">IT STUDENT  •  LABORATORY ASSISTANT  •  UNIVERSITAS SUMATERA UTARA</text>

  <g>
    <rect x="0"   y="226" width="400" height="14" fill="#770707"/>
    <rect x="400" y="226" width="250" height="14" fill="#1A5187"/>
    <rect x="650" y="226" width="150" height="14" fill="#989898"/>
    <rect x="800" y="226" width="100" height="14" fill="#41E841"/>
    <rect x="900" y="226" width="100" height="14" fill="#DF3232"/>
  </g>
  <rect x="0" y="226" width="1000" height="14" rx="0" fill="none"/>
</svg>
