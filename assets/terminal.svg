<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="356" viewBox="0 0 1000 356" role="img" aria-label="Profile summary terminal">
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#770707"/>
      <stop offset="100%" stop-color="#2B2B2B"/>
    </linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="998" height="354" rx="14"/></clipPath>
    <style>
      .m  { font: 500 17px 'Consolas', 'Courier New', monospace; }
      .p  { fill: #41E841; font-weight: 700; }
      .c  { fill: #FFFFFF; }
      .o  { fill: #989898; }
      .h  { fill: #DF3232; font-weight: 700; }
      .t  { font: 600 14px 'Consolas', 'Courier New', monospace; fill: #E6E6E6; }
      .l  { opacity: 0; animation: in .5s ease-out forwards; }
      .cur { fill: #41E841; animation: blink 1s steps(1) infinite; }
      @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="354" rx="14" fill="#1E1E1E" stroke="#989898" stroke-opacity="0.35"/>
  <g clip-path="url(#c)">
    <rect x="1" y="1" width="998" height="42" fill="url(#tb)"/>
  </g>
  <circle cx="26" cy="22" r="7" fill="#DF3232"/>
  <circle cx="48" cy="22" r="7" fill="#989898"/>
  <circle cx="70" cy="22" r="7" fill="#41E841"/>
  <text class="t" x="500" y="27" text-anchor="middle">yopalll@github ~ profile</text>

  <g class="m">
    <g class="l" style="animation-delay:.2s"><text x="30" y="82"><tspan class="p">$ </tspan><tspan class="c">whoami</tspan></text></g>
    <g class="l" style="animation-delay:.5s"><text x="30" y="108" class="h">  Yosua Valentino Gulo (@yopalll)</text></g>

    <g class="l" style="animation-delay:.9s"><text x="30" y="148"><tspan class="p">$ </tspan><tspan class="c">cat role.txt</tspan></text></g>
    <g class="l" style="animation-delay:1.2s"><text x="30" y="174" class="o">  Backend / Full-Stack Developer  +  FOH Live Sound Engineer</text></g>

    <g class="l" style="animation-delay:1.6s"><text x="30" y="214"><tspan class="p">$ </tspan><tspan class="c">cat education.txt</tspan></text></g>
    <g class="l" style="animation-delay:1.9s"><text x="30" y="240" class="o">  IT Student @ Universitas Sumatera Utara</text></g>

    <g class="l" style="animation-delay:2.3s"><text x="30" y="280"><tspan class="p">$ </tspan><tspan class="c">cat work.txt</tspan></text></g>
    <g class="l" style="animation-delay:2.6s"><text x="30" y="306" class="o">  Laboratory Assistant @ ITLG</text></g>

    <g class="l" style="animation-delay:3s"><text x="30" y="332"><tspan class="p">$ </tspan></text></g>
  </g>
  <rect class="cur" x="52" y="318" width="10" height="17"/>
</svg>
