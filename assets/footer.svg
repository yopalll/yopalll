<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160" role="img" aria-label="Logic in code. Clarity in sound.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#770707"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="160" rx="18"/></clipPath>
    <style>
      .q { font: 700 22px 'Consolas', 'Courier New', monospace; fill: #FFFFFF; letter-spacing: 1px; }
      .s { font: 500 14px 'Consolas', 'Courier New', monospace; fill: #989898; }
      .w1 { animation: drift 14s linear infinite; }
      .w2 { animation: drift 9s linear infinite; }
      .w3 { animation: drift 20s linear infinite reverse; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="160" fill="url(#bg)"/>
    <g class="w3" opacity="0.55"><path d="M0 100 Q250 60 500 100 T1000 100 T1500 100 T2000 100 V160 H0Z" fill="#1A5187"/></g>
    <g class="w1" opacity="0.7"><path d="M0 115 Q250 75 500 115 T1000 115 T1500 115 T2000 115 V160 H0Z" fill="#770707"/></g>
    <g class="w2" opacity="0.9"><path d="M0 132 Q250 100 500 132 T1000 132 T1500 132 T2000 132 V160 H0Z" fill="#1E1E1E"/></g>
    <rect x="0" y="148" width="1000" height="12" fill="#1E1E1E" opacity="0"/>
  </g>
  <text class="q" x="500" y="58" text-anchor="middle">Logic in code. Clarity in sound.</text>
  <text class="s" x="500" y="86" text-anchor="middle">&#169; yopalll &#183; Yosua Valentino Gulo</text>
</svg>
