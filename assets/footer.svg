<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="Logic in code. Clarity in sound.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="60%" stop-color="#3A0707"/>
      <stop offset="100%" stop-color="#770707"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DF3232"/>
      <stop offset="100%" stop-color="#41E841"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="170" rx="18"/></clipPath>
    <style>
      .q { font: 700 24px 'Consolas', 'Courier New', monospace; fill: #FFFFFF; letter-spacing: 1px; }
      .s { font: 500 14px 'Consolas', 'Courier New', monospace; fill: #989898; }
      .w1 { animation: drift 16s linear infinite; }
      .w2 { animation: drift 10s linear infinite; }
      .w3 { animation: drift 22s linear infinite reverse; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="170" fill="url(#bg)"/>
    <g class="w3" opacity="0.75"><path d="M0 104 Q250 62 500 104 T1000 104 T1500 104 T2000 104 V170 H0Z" fill="#1A5187"/></g>
    <g class="w1" opacity="0.85"><path d="M0 122 Q250 80 500 122 T1000 122 T1500 122 T2000 122 V170 H0Z" fill="#DF3232"/></g>
    <g class="w2"><path d="M0 142 Q250 108 500 142 T1000 142 T1500 142 T2000 142 V170 H0Z" fill="#770707"/></g>
    <rect x="0" y="162" width="1000" height="8" fill="#1E1E1E" opacity="0.55"/>
  </g>
  <rect x="440" y="30" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text class="q" x="500" y="68" text-anchor="middle">Logic in code. Clarity in sound.</text>
  <text class="s" x="500" y="94" text-anchor="middle">&#169; yopalll &#183; Yosua Valentino Gulo</text>
</svg>
